---
- name: Read local account records for SSH path lookup
  ansible.builtin.getent:
    database: passwd
    service: files

- name: Confirm the SSH administrator exists locally
  ansible.builtin.assert:
    that: hardening_ssh_user in ansible_facts.getent_passwd
    fail_msg: "SSH administrator {{ hardening_ssh_user }} was not found in the local passwd database."

- name: Confirm the admin user has an authorized key
  ansible.builtin.stat:
    path: "{{ ansible_facts.getent_passwd[hardening_ssh_user][4] }}/.ssh/authorized_keys"
  register: admin_keys

- name: Stop if there is no key to fall back on
  ansible.builtin.assert:
    that: admin_keys.stat.exists
    fail_msg: "No authorized key found for {{ hardening_ssh_user }}; refusing to harden SSH."

- name: Install SSH hardening drop-in
  ansible.builtin.template:
    src: 00-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/00-hardening.conf
    owner: root
    group: root
    mode: "0600"
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload sshd