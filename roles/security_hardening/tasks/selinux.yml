---
- name: Configure SELinux enforcing mode and targeted policy
  ansible.posix.selinux:
    policy: targeted
    state: enforcing
    update_kernel_param: true
  register: hardening_selinux_result

- name: Require a reboot before continuing if SELinux changes need one
  ansible.builtin.assert:
    that: not hardening_selinux_result.reboot_required
    fail_msg: "SELinux configuration was updated, but a reboot is required. Reboot the test host, verify applications, then rerun the playbook."

- name: Read the active SELinux mode
  ansible.builtin.command:
    argv:
      - getenforce
  register: hardening_selinux_mode
  changed_when: false

- name: Read SELinux policy and persistent configuration
  ansible.builtin.command:
    argv:
      - sestatus
  register: hardening_selinux_status
  changed_when: false

- name: Read persistent SELinux settings
  ansible.builtin.command:
    argv:
      - grep
      - -E
      - '^(SELINUX|SELINUXTYPE)='
      - /etc/selinux/config
  register: hardening_selinux_config
  changed_when: false

- name: Assert SELinux is enforcing with the targeted policy
  ansible.builtin.assert:
    that:
      - hardening_selinux_mode.stdout == "Enforcing"
      - "hardening_selinux_status.stdout | regex_search('(?m)^Loaded policy name: *targeted *$') is not none"
      - "hardening_selinux_status.stdout | regex_search('(?m)^Mode from config file: *enforcing *$') is not none"
      - "'SELINUX=enforcing' in hardening_selinux_config.stdout"
      - "'SELINUXTYPE=targeted' in hardening_selinux_config.stdout"
    fail_msg: "SELinux must be active in enforcing mode with the targeted policy, both now and after reboot."
